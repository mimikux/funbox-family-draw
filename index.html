<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>9/4–9/5 親友幫抽抽｜FUNBOX</title>
<style>
:root{--green:#21a366;--orange:#e58b2a;--purple:#7453b8;--blue:#3977c5;--gray:#a7a7a7;--bg:#f5f6f8;--text:#222;--danger:#d9534f}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",Roboto,"Helvetica Neue",Arial,sans-serif;font-size:18px;line-height:1.55}
.wrap{max-width:1080px;margin:auto;padding:24px 18px 60px}h1{font-size:clamp(32px,6vw,46px);line-height:1.15;text-align:center;margin:4px 0 8px;color:#1f497d}.cheer{font-size:clamp(24px,4.8vw,34px);font-weight:800;text-align:center;margin:0 0 18px;color:#333}.hero{background:white;border-radius:18px;padding:20px 22px;box-shadow:0 2px 10px rgba(0,0,0,.06);margin-bottom:20px}.hero .sub{font-size:20px;line-height:1.75}.hero ol{margin:6px 0 0;padding-left:1.6em}.hero li{margin:8px 0}.danger{color:#c62828;font-weight:900}.toolbar{position:sticky;top:0;z-index:20;background:rgba(245,246,248,.94);backdrop-filter:blur(8px);padding:10px 0 12px;margin-bottom:8px}.sync-row{display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap}.sync-btn,.reset-btn{border:0;border-radius:12px;padding:12px 18px;font-size:18px;font-weight:800;cursor:pointer}.sync-btn{background:#1f497d;color:#fff}.reset-btn{background:var(--danger);color:#fff}.status{text-align:center;font-size:16px;color:#666;margin-top:8px}.filters{display:flex;gap:8px;overflow-x:auto;padding:9px 2px 4px;scrollbar-width:thin}.filter-btn{flex:0 0 auto;border:0;border-radius:999px;padding:10px 15px;font-size:17px;font-weight:800;background:#e3e6ea;color:#333;cursor:pointer}.filter-btn.active{background:#1f497d;color:white}.legend{display:flex;justify-content:center;flex-wrap:wrap;gap:12px;font-size:18px;margin:14px 0 18px}.dot{width:18px;height:18px;border-radius:50%;display:inline-block;vertical-align:-3px;margin-right:5px}.city{font-size:28px;font-weight:900;color:#1f497d;border-bottom:3px solid #1f497d;padding:4px 0 7px;margin:26px 0 13px}.store{background:white;border-radius:16px;padding:18px 19px;margin:0 0 14px;box-shadow:0 2px 8px rgba(0,0,0,.055)}.store-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}.store-name{font-size:24px;font-weight:900}.badge{font-size:19px;font-weight:900;border-radius:999px;padding:5px 11px;background:#e8edf2;color:#445}.badge.live{background:#e3f6ea;color:#157a44}.badge.future{background:#fff1d8;color:#986000}.badge.closed{background:#eee;color:#777}.draw-start{font-size:18px;color:#666;margin:5px 0 8px}.item{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:center;border-top:1px solid #ececec;padding:13px 0}.product{font-size:21px;font-weight:750;word-break:break-word}.draw-link{display:inline-flex;align-items:center;justify-content:center;min-width:88px;text-decoration:none;color:white;border-radius:10px;padding:10px 15px;font-size:20px;font-weight:900;background:var(--green)}.draw-link.bx{background:var(--purple)}.draw-link.cx{background:var(--orange)}.draw-link.other{background:var(--blue)}.draw-link.visited{background:var(--gray)!important}.draw-link.disabled{background:#c8c8c8!important;color:#777;pointer-events:none}.empty,.error{background:white;border-radius:16px;padding:24px;text-align:center;font-size:20px}.error{color:#a32121}.footer{text-align:center;color:#777;font-size:16px;margin-top:28px}.source-link{color:#1f497d}.hidden{display:none!important}
@media(max-width:600px){.wrap{padding:16px 13px 46px}.hero{padding:17px 16px}.item{grid-template-columns:1fr;gap:8px}.draw-link{width:100%;padding:12px 14px}.store{padding:16px}.store-name{font-size:23px}.city{font-size:27px}.filter-btn{font-size:16px}.sync-btn,.reset-btn{font-size:17px}}
.photos{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:0 0 20px}.photo-card{background:#fff;border-radius:18px;padding:8px;box-shadow:0 2px 10px rgba(0,0,0,.06);overflow:hidden}.photo-card img{display:block;width:100%;height:auto;border-radius:12px}@media(max-width:700px){.photos{grid-template-columns:1fr;gap:12px}.photo-card{padding:7px}}
</style>
</head>
<body>
<div class="wrap">
  <h1>9/4–9/5｜親友幫抽抽2</h1>
  <div class="cheer">感謝各位親友，原價陀螺戰士阿平愛你唷😍！</div>

  <section class="photos" aria-label="上次抽選戰果照片">
    <div class="photo-card"><img src="https://i.urusai.cc/DK9iw.png" alt="抽中戰鬥陀螺的開心照片" referrerpolicy="no-referrer"></div>
    <div class="photo-card"><img src="https://i.urusai.cc/125Tb.png" alt="FUNBOX 原價陀螺戰果照片" referrerpolicy="no-referrer"></div>
  </section>

  <section class="hero">
    <div class="sub"><ol>
      <li>中獎率很低，沒中很正常。</li>
      <li>點「抽獎」後會變灰；這台裝置會自動記錄。要重置請按紅色按鈕。</li>
      <li>抽選期間為 <strong>9/4–9/5</strong>；中獎後請依券面期限到店購買，勿抽自己無法到場的店。</li>
      <li>萬一抽中 <span class="danger">❌請不要自己點選「使用優惠券」！</span> 兌換券由店員操作，點開可能失效。</li>
      <li>感謝大家幫忙，阿平愛你喔😍</li>
    </ol></div>
  </section>

  <div class="toolbar">
    <div class="sync-row">
      <button class="sync-btn" id="syncBtn" type="button">↻ 立即更新資料</button>
      <button class="reset-btn" id="resetBtn" type="button">清除這台裝置的已抽標記</button>
    </div>
    <div class="status" id="status">正在讀取最新抽選資料…</div>
    <div class="filters" id="filters"></div>
  </div>

  <div class="legend">
    <span><i class="dot" style="background:var(--green)"></i>UX</span>
    <span><i class="dot" style="background:var(--purple)"></i>BX</span>
    <span><i class="dot" style="background:var(--orange)"></i>CX</span>
    <span><i class="dot" style="background:var(--gray)"></i>已抽過</span>
  </div>

  <main id="list"></main>
  <div class="footer">資料來源：<a class="source-link" href="https://uxux11.github.io/funbox-line/" target="_blank" rel="noopener">FUNBOX 抽選監控頁</a>。本頁每次開啟會抓最新資料，開著時每小時自動同步。</div>
</div>
<script>
(() => {
  'use strict';
  const SOURCE_URLS = [
    'https://raw.githubusercontent.com/UXUX11/funbox-line/main/index.html',
    'https://uxux11.github.io/funbox-line/'
  ];
  const STORAGE_KEY = 'aping_beyblade_20260904_0905_visited';
  const WAVE_DATES = ['2026/09/04','2026/09/05'];
  const EXCLUDE_CODE = /\b(?:BXG-\d+|BX-26|BX-33)\b/i;
  const EXCLUDE_WORDS = /(戰鬥盤|收納包|收納箱|收納盒|發射器)/i;
  const state = { entries: [], city: '全部', loadedAt: null };
  const $ = (s, r=document) => r.querySelector(s);
  const $$ = (s, r=document) => Array.from(r.querySelectorAll(s));

  function readVisited(){ try{return new Set(JSON.parse(localStorage.getItem(STORAGE_KEY)||'[]'));}catch{return new Set();} }
  function writeVisited(set){ localStorage.setItem(STORAGE_KEY, JSON.stringify([...set])); }
  function hash(s){ let h=2166136261; for(let i=0;i<s.length;i++){ h^=s.charCodeAt(i); h=Math.imul(h,16777619); } return (h>>>0).toString(36); }
  function cleanProduct(s){ return s.replace(/\s+/g,' ').trim(); }
  function itemKey(city,store,product){ return 'draw-'+hash([city,store,cleanProduct(product).replace(/（\$?[\d,]+）/g,'')].join('|')); }
  function isExcluded(product){ return EXCLUDE_CODE.test(product) || EXCLUDE_WORDS.test(product) || /BX-00\s*暴風天馬3-70RA/i.test(product); }
  function inWave(startText){ return WAVE_DATES.some(d=>startText.includes(d)); }
  function pad(n){return String(n).padStart(2,'0');}
  function parseDateTime(s){
    const m=s.match(/(2026)\/(\d{2})\/(\d{2})(?:\s+(\d{1,2}):(\d{2}))?/);
    if(!m) return null;
    return new Date(+m[1],+m[2]-1,+m[3],m[4]===undefined?0:+m[4],m[5]===undefined?0:+m[5],0,0);
  }
  function timing(text){
    const now=new Date();
    const startMatch=text.match(/2026\/09\/04\s+(\d{1,2}):(\d{2})/);
    const endMatch=text.match(/~\s*(2026\/09\/0[45]\s+\d{1,2}:\d{2})/);
    const start=startMatch?new Date(2026,8,4,+startMatch[1],+startMatch[2]):null;
    const end=endMatch?parseDateTime(endMatch[1]):null;
    if(end && now>end) return {label:'已截止', cls:'closed', disabled:true};
    if(start && now<start) return {label:`${pad(start.getHours())}:${pad(start.getMinutes())} 開抽`, cls:'future', disabled:true};
    if(start && now>=start) return {label:'現在可抽', cls:'live', disabled:false};
    return {label:'抽選連結已公布', cls:'', disabled:false};
  }

  function extract(html){
    const doc=new DOMParser().parseFromString(html,'text/html');
    const rows=[];
    $$('.draw-store',doc).forEach(storeEl=>{
      const city=storeEl.getAttribute('data-draw-city') || storeEl.closest('.draw-city-group')?.getAttribute('data-draw-city-group') || '其他';
      const store=$('.draw-store-name',storeEl)?.textContent.trim() || '未命名門市';
      const startText=$('.draw-start',storeEl)?.textContent.trim() || '';
      if(!inWave(startText)) return;
      $$('.draw-item',storeEl).forEach(item=>{
        const product=cleanProduct($('.draw-product',item)?.textContent||'');
        const link=$('.draw-link',item);
        const href=link?.getAttribute('href')||'';
        if(!product || !href || isExcluded(product)) return;
        rows.push({city,store,startText,product,href,key:itemKey(city,store,product)});
      });
    });
    return rows;
  }

  async function fetchSource(){
    let lastErr;
    for(const base of SOURCE_URLS){
      try{
        const url=base+(base.includes('?')?'&':'?')+'t='+Date.now();
        const res=await fetch(url,{cache:'no-store'});
        if(!res.ok) throw new Error(`HTTP ${res.status}`);
        return await res.text();
      }catch(e){lastErr=e;}
    }
    throw lastErr || new Error('無法讀取來源');
  }

  function renderFilters(){
    const el=$('#filters');
    const counts=new Map();
    state.entries.forEach(x=>counts.set(x.city,(counts.get(x.city)||0)+1));
    const cities=[...counts.keys()].sort((a,b)=>a.localeCompare(b,'zh-Hant'));
    el.innerHTML='';
    ['全部',...cities].forEach(city=>{
      const b=document.createElement('button');
      b.type='button'; b.className='filter-btn'+(state.city===city?' active':'');
      b.textContent=city==='全部'?`全部 (${state.entries.length})`:`${city} (${counts.get(city)||0})`;
      b.addEventListener('click',()=>{state.city=city;render();});
      el.appendChild(b);
    });
  }

  function linkClass(product){
    if(/^UX-/i.test(product)) return '';
    if(/^BX-/i.test(product)) return ' bx';
    if(/^CX-/i.test(product)) return ' cx';
    return ' other';
  }

  function render(){
    renderFilters();
    const list=$('#list');
    const visited=readVisited();
    const filtered=state.city==='全部'?state.entries:state.entries.filter(x=>x.city===state.city);
    if(!filtered.length){ list.innerHTML='<div class="empty">目前這個篩選沒有符合條件的抽選。</div>'; return; }
    const byCity=new Map();
    filtered.forEach(x=>{ if(!byCity.has(x.city)) byCity.set(x.city,new Map()); const sm=byCity.get(x.city); const sk=x.store+'|||'+x.startText; if(!sm.has(sk)) sm.set(sk,[]); sm.get(sk).push(x); });
    list.innerHTML='';
    for(const [city,stores] of byCity){
      const cityEl=document.createElement('section');
      cityEl.innerHTML=`<div class="city">${escapeHtml(city)}</div>`;
      for(const [sk,items] of stores){
        const [storeName,startText]=sk.split('|||');
        const t=timing(startText);
        const store=document.createElement('div'); store.className='store';
        store.innerHTML=`<div class="store-head"><div class="store-name">${escapeHtml(storeName)}</div><div class="badge ${t.cls}">${escapeHtml(t.label)}</div></div><div class="draw-start">${escapeHtml(startText)}</div><div class="items"></div>`;
        const itemsBox=$('.items',store);
        items.forEach(x=>{
          const row=document.createElement('div'); row.className='item';
          const isVisited=visited.has(x.key);
          row.innerHTML=`<div class="product">${escapeHtml(x.product)}</div><a class="draw-link${linkClass(x.product)}${isVisited?' visited':''}${t.disabled?' disabled':''}" href="${escapeAttr(x.href)}" target="_blank" rel="noopener">${isVisited?'已抽過':'抽獎'}</a>`;
          const a=$('a',row);
          a.addEventListener('click',()=>{ if(t.disabled) return; const v=readVisited(); v.add(x.key); writeVisited(v); a.classList.add('visited'); a.textContent='已抽過'; });
          itemsBox.appendChild(row);
        });
        cityEl.appendChild(store);
      }
      list.appendChild(cityEl);
    }
  }

  function escapeHtml(s){ return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c])); }
  function escapeAttr(s){ return escapeHtml(s); }

  async function load(){
    const btn=$('#syncBtn'); const status=$('#status');
    btn.disabled=true; status.textContent='正在讀取最新抽選資料…';
    try{
      const html=await fetchSource();
      state.entries=extract(html);
      state.loadedAt=new Date();
      if(state.city!=='全部' && !state.entries.some(x=>x.city===state.city)) state.city='全部';
      render();
      status.textContent=`已同步 ${state.entries.length} 個符合條件的抽選｜${state.loadedAt.toLocaleString('zh-TW',{hour12:false})}`;
    }catch(e){
      console.error(e);
      status.textContent='同步失敗，請稍後再試。';
      $('#list').innerHTML='<div class="error">暫時無法讀取最新清單。可按「立即更新資料」重試。</div>';
    }finally{btn.disabled=false;}
  }

  $('#syncBtn').addEventListener('click',load);
  $('#resetBtn').addEventListener('click',()=>{
    if(confirm('確定要清除這台裝置的所有「已抽過」標記嗎？')){ localStorage.removeItem(STORAGE_KEY); render(); }
  });
  setInterval(()=>{ render(); },15000);
  setInterval(load,60*60*1000);
  load();
})();
</script>
</body>
</html>
