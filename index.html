<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>本週親友幫抽抽｜FUNBOX</title>
<style>
:root{--green:#21a366;--orange:#e58b2a;--purple:#7453b8;--blue:#3977c5;--gray:#a7a7a7;--bg:#f5f6f8;--text:#222;--danger:#d9534f}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",Roboto,"Helvetica Neue",Arial,sans-serif;font-size:18px;line-height:1.55}
.wrap{max-width:1080px;margin:auto;padding:24px 18px 60px}
h1{font-size:clamp(32px,6vw,46px);line-height:1.15;text-align:center;margin:4px 0 8px;color:#1f497d}
.cheer{font-size:clamp(24px,4.8vw,34px);font-weight:800;text-align:center;margin:0 0 18px;color:#333}
.photos{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:0 0 20px}
.photo-card{background:#fff;border-radius:18px;padding:8px;box-shadow:0 2px 10px rgba(0,0,0,.06);overflow:hidden}
.photo-card img{display:block;width:100%;height:auto;border-radius:12px}
.hero{background:#fff;border-radius:18px;padding:20px 22px;box-shadow:0 2px 10px rgba(0,0,0,.06);margin-bottom:20px}
.hero .sub{font-size:20px;line-height:1.75}.hero ol{margin:6px 0 0;padding-left:1.6em}.hero li{margin:8px 0}
.danger{color:#c62828;font-weight:900}
.toolbar{position:sticky;top:0;z-index:20;background:rgba(245,246,248,.94);backdrop-filter:blur(8px);padding:10px 0 12px;margin-bottom:8px}
.sync-row{display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap}
.sync-btn,.reset-btn{border:0;border-radius:12px;padding:12px 18px;font-size:18px;font-weight:800;cursor:pointer}
.sync-btn{background:#1f497d;color:#fff}.reset-btn{background:var(--danger);color:#fff}
.status{text-align:center;font-size:16px;color:#666;margin-top:8px}
.filters{display:flex;gap:8px;overflow-x:auto;padding:9px 2px 4px;scrollbar-width:thin}
.filter-btn{flex:0 0 auto;border:0;border-radius:999px;padding:10px 15px;font-size:17px;font-weight:800;background:#e3e6ea;color:#333;cursor:pointer}
.filter-btn.active{background:#1f497d;color:#fff}
.legend{display:flex;justify-content:center;flex-wrap:wrap;gap:12px;font-size:18px;margin:14px 0 18px}
.dot{width:18px;height:18px;border-radius:50%;display:inline-block;vertical-align:-3px;margin-right:5px}
.city{font-size:28px;font-weight:900;color:#1f497d;border-bottom:3px solid #1f497d;padding:4px 0 7px;margin:26px 0 13px}
.store{background:#fff;border-radius:16px;padding:18px 19px;margin:0 0 14px;box-shadow:0 2px 8px rgba(0,0,0,.055)}
.store-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
.store-name{font-size:24px;font-weight:900}
.badge{font-size:19px;font-weight:900;border-radius:999px;padding:5px 11px;background:#e8edf2;color:#445}
.badge.live{background:#e3f6ea;color:#157a44}.badge.future{background:#fff1d8;color:#986000}.badge.closed{background:#eee;color:#777}
.draw-start{font-size:18px;color:#666;margin:5px 0 8px}
.item{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:center;border-top:1px solid #ececec;padding:13px 0}
.product{font-size:21px;font-weight:750;word-break:break-word}
.draw-link{display:inline-flex;align-items:center;justify-content:center;min-width:88px;text-decoration:none;color:#fff;border-radius:10px;padding:10px 15px;font-size:20px;font-weight:900;background:var(--green)}
.draw-link.bx{background:var(--purple)}.draw-link.cx{background:var(--orange)}.draw-link.other{background:var(--blue)}
.draw-link.visited{background:var(--gray)!important}.draw-link.disabled{background:#c8c8c8!important;color:#777;pointer-events:none}
.empty,.error{background:#fff;border-radius:16px;padding:24px;text-align:center;font-size:20px}.error{color:#a32121}
.footer{text-align:center;color:#777;font-size:16px;margin-top:28px}.source-link{color:#1f497d}
@media(max-width:700px){.photos{grid-template-columns:1fr;gap:12px}.photo-card{padding:7px}}
@media(max-width:600px){.wrap{padding:16px 13px 46px}.hero{padding:17px 16px}.item{grid-template-columns:1fr;gap:8px}.draw-link{width:100%;padding:12px 14px}.store{padding:16px}.store-name{font-size:23px}.city{font-size:27px}.filter-btn{font-size:16px}.sync-btn,.reset-btn{font-size:17px}}
</style>
</head>
<body>
<div class="wrap">
  <h1 id="pageTitle">本週｜親友幫抽抽2</h1>
  <div class="cheer">感謝各位親友，原價陀螺戰士阿平愛你唷😍！</div>

  <section class="photos" aria-label="上次抽選戰果照片">
    <div class="photo-card"><img src="https://i.urusai.cc/DK9iw.png" alt="抽中戰鬥陀螺的開心照片" referrerpolicy="no-referrer"></div>
    <div class="photo-card"><img src="https://i.urusai.cc/125Tb.png" alt="FUNBOX 原價陀螺戰果照片" referrerpolicy="no-referrer"></div>
  </section>

  <section class="hero">
    <div class="sub"><ol>
      <li>中獎率很低，沒中很正常。</li>
      <li>點「抽獎」後會變灰；這台裝置會自動記錄。要重置請按紅色按鈕。</li>
      <li>抽選期間為 <strong id="waveLabel">讀取最新抽選中…</strong>；中獎後請依券面期限到店購買，勿抽自己無法到場的店。</li>
      <li>萬一抽中 <span class="danger">❌請不要自己點選「使用優惠券」！</span> 兌換券由店員操作，點開可能失效。</li>
      <li>感謝大家幫忙，阿平愛你喔😍</li>
    </ol></div>
  </section>

  <div class="toolbar">
    <div class="sync-row">
      <button class="sync-btn" id="syncBtn" type="button">↻ 立即更新資料</button>
      <button class="reset-btn" id="resetBtn" type="button">清除這台裝置的已抽標記</button>
    </div>
    <div class="status" id="status">正在讀取最新抽選資料…</div>
    <div class="filters" id="filters"></div>
  </div>

  <div class="legend">
    <span><i class="dot" style="background:var(--green)"></i>UX</span>
    <span><i class="dot" style="background:var(--purple)"></i>BX</span>
    <span><i class="dot" style="background:var(--orange)"></i>CX</span>
    <span><i class="dot" style="background:var(--gray)"></i>已抽過</span>
  </div>

  <main id="list"></main>
  <div class="footer">資料來源：<a class="source-link" href="https://uxux11.github.io/funbox-line/" target="_blank" rel="noopener">FUNBOX 抽選監控頁</a>。每次開啟會抓最新資料；頁面保持開啟時每小時自動同步。</div>
</div>
<script>
(() => {
  'use strict';

  const SOURCE_URLS = [
    'https://raw.githubusercontent.com/UXUX11/funbox-line/main/index.html',
    'https://uxux11.github.io/funbox-line/'
  ];

  const ACCESSORY_WORDS = /(戰鬥盤|對戰盤|競技場|收納包|收納箱|收納盒|收納袋|發射器|握把|拉條)/i;
  const EXCLUDE_CODE = /\b(?:BXG-\d+|BX-26|BX-33)\b/i;
  const EXCLUDE_BX00 = /\bBX-00\s*暴風天馬/i;
  const CITY_ORDER = ['基隆','台北','新北','桃園','新竹市','新竹縣','苗栗','台中','彰化','南投','雲林','嘉義市','嘉義縣','台南','高雄','屏東','澎湖','金門','連江','宜蘭','花蓮','台東'];

  const state = {
    entries: [],
    city: '全部',
    loadedAt: null,
    waveStart: '',
    waveEnd: '',
    waveLabel: '本週',
    storageKey: 'aping_beyblade_pending_visited'
  };

  const $ = (s, r=document) => r.querySelector(s);
  const $$ = (s, r=document) => Array.from(r.querySelectorAll(s));

  function readVisited(){
    try { return new Set(JSON.parse(localStorage.getItem(state.storageKey) || '[]')); }
    catch { return new Set(); }
  }
  function writeVisited(set){ localStorage.setItem(state.storageKey, JSON.stringify([...set])); }

  function hash(s){
    let h=2166136261;
    for(let i=0;i<s.length;i++){ h^=s.charCodeAt(i); h=Math.imul(h,16777619); }
    return (h>>>0).toString(36);
  }
  function cleanProduct(s){ return String(s||'').replace(/\s+/g,' ').trim(); }
  function itemKey(city,store,product){
    return 'draw-'+hash([city,store,cleanProduct(product).replace(/（\$?[\d,，／/]+.*?）/g,'')].join('|'));
  }

  function isExcluded(product){
    const p=cleanProduct(product);
    return EXCLUDE_CODE.test(p) || EXCLUDE_BX00.test(p) || ACCESSORY_WORDS.test(p);
  }

  function parseDateOnly(s){
    const m=String(s||'').match(/(\d{4})\/(\d{2})\/(\d{2})/);
    if(!m) return null;
    return new Date(+m[1],+m[2]-1,+m[3],0,0,0,0);
  }
  function allDateKeys(text){ return [...String(text||'').matchAll(/(\d{4}\/\d{2}\/\d{2})/g)].map(m=>m[1]); }

  function chooseWave(doc){
    const groups=new Map();
    $$('.draw-store',doc).forEach(storeEl=>{
      const text=$('.draw-start',storeEl)?.textContent.trim() || '';
      const dates=allDateKeys(text);
      if(!dates.length) return;
      const startKey=dates[0];
      const endKey=dates[dates.length-1] || startKey;
      const start=parseDateOnly(startKey);
      const end=parseDateOnly(endKey) || start;
      if(!start || !end) return;
      if(!groups.has(startKey)) groups.set(startKey,{startKey,start,endKey,end});
      const g=groups.get(startKey);
      if(end>g.end){ g.end=end; g.endKey=endKey; }
    });

    const list=[...groups.values()].sort((a,b)=>a.start-b.start);
    if(!list.length) return null;
    const today=new Date(); today.setHours(0,0,0,0);
    const activeOrUpcoming=list.filter(g=>g.end>=today);
    return activeOrUpcoming[0] || list[list.length-1];
  }

  function shortDate(key){
    const p=key.split('/');
    return p.length===3 ? `${+p[1]}/${+p[2]}` : key;
  }
  function applyWave(wave){
    if(!wave) return;
    state.waveStart=wave.startKey;
    state.waveEnd=wave.endKey || wave.startKey;
    state.waveLabel=state.waveStart===state.waveEnd ? shortDate(state.waveStart) : `${shortDate(state.waveStart)}–${shortDate(state.waveEnd)}`;
    state.storageKey=`aping_beyblade_${state.waveStart.replaceAll('/','')}_${state.waveEnd.replaceAll('/','')}_visited`;
    $('#pageTitle').textContent=`${state.waveLabel}｜親友幫抽抽2`;
    $('#waveLabel').textContent=state.waveLabel;
    document.title=`${state.waveLabel} 親友幫抽抽｜FUNBOX`;
  }

  function isCurrentWave(startText){
    const dates=allDateKeys(startText);
    return dates.length && dates[0]===state.waveStart;
  }

  function parseStoreStart(text){
    const s=String(text||'');
    const m=s.match(/(\d{4})\/(\d{2})\/(\d{2})(?:\s+(\d{1,2}):(\d{2}))?/);
    if(!m) return null;
    let hh=m[4]===undefined ? null : +m[4];
    let mm=m[5]===undefined ? null : +m[5];
    if(hh===null){
      const biz=s.match(/營業時間\s*(\d{1,2}):(\d{2})/);
      if(biz){ hh=+biz[1]; mm=+biz[2]; }
    }
    if(hh===null){ hh=0; mm=0; }
    return new Date(+m[1],+m[2]-1,+m[3],hh,mm,0,0);
  }

  function parseStoreEnd(text){
    const s=String(text||'');
    const matches=[...s.matchAll(/(\d{4})\/(\d{2})\/(\d{2})(?:\s+(\d{1,2}):(\d{2}))?/g)];
    if(matches.length<2) return null;
    const m=matches[matches.length-1];
    let hh=m[4]===undefined ? null : +m[4];
    let mm=m[5]===undefined ? null : +m[5];
    if(hh===null){
      const biz=[...s.matchAll(/(\d{1,2}):(\d{2})/g)];
      if(biz.length){ const last=biz[biz.length-1]; hh=+last[1]; mm=+last[2]; }
    }
    if(hh===null){ hh=23; mm=59; }
    return new Date(+m[1],+m[2]-1,+m[3],hh,mm,59,999);
  }

  function timing(text){
    const now=new Date();
    const start=parseStoreStart(text);
    const end=parseStoreEnd(text);
    if(end && now>end) return {label:'已截止',cls:'closed',disabled:true};
    if(start && now<start) return {label:`${String(start.getHours()).padStart(2,'0')}:${String(start.getMinutes()).padStart(2,'0')} 開抽`,cls:'future',disabled:true};
    if(start) return {label:'現在可抽',cls:'live',disabled:false};
    return {label:'抽選連結已公布',cls:'',disabled:false};
  }

  function extract(html){
    const doc=new DOMParser().parseFromString(html,'text/html');
    const wave=chooseWave(doc);
    if(!wave) throw new Error('來源頁找不到抽選日期');
    applyWave(wave);

    const rows=[];
    $$('.draw-store',doc).forEach(storeEl=>{
      const city=storeEl.getAttribute('data-draw-city') || storeEl.closest('.draw-city-group')?.getAttribute('data-draw-city-group') || '其他';
      const store=$('.draw-store-name',storeEl)?.textContent.trim() || '未命名門市';
      const startText=$('.draw-start',storeEl)?.textContent.trim() || '';
      if(!isCurrentWave(startText)) return;

      $$('.draw-item',storeEl).forEach(item=>{
        const product=cleanProduct($('.draw-product',item)?.textContent || '');
        const link=$('.draw-link',item);
        const href=link?.getAttribute('href') || item.getAttribute('data-draw-href') || '';
        if(!product || !href || isExcluded(product)) return;
        rows.push({city,store,startText,product,href,key:itemKey(city,store,product)});
      });
    });
    return rows;
  }

  async function fetchSource(){
    let lastErr;
    for(const base of SOURCE_URLS){
      try{
        const url=base+(base.includes('?')?'&':'?')+'t='+Date.now();
        const res=await fetch(url,{cache:'no-store'});
        if(!res.ok) throw new Error(`HTTP ${res.status}`);
        return await res.text();
      }catch(e){ lastErr=e; }
    }
    throw lastErr || new Error('無法讀取來源');
  }

  function cityRank(city){
    const c=String(city||'').replace(/臺/g,'台');
    const i=CITY_ORDER.findIndex(name=>c.includes(name) || name.includes(c));
    return i<0 ? CITY_ORDER.length : i;
  }

  function renderFilters(){
    const el=$('#filters');
    const counts=new Map();
    state.entries.forEach(x=>counts.set(x.city,(counts.get(x.city)||0)+1));
    const cities=[...counts.keys()].sort((a,b)=>cityRank(a)-cityRank(b) || a.localeCompare(b,'zh-Hant'));
    el.innerHTML='';
    ['全部',...cities].forEach(city=>{
      const b=document.createElement('button');
      b.type='button';
      b.className='filter-btn'+(state.city===city?' active':'');
      b.textContent=city==='全部' ? `全部 (${state.entries.length})` : `${city} (${counts.get(city)||0})`;
      b.addEventListener('click',()=>{ state.city=city; render(); });
      el.appendChild(b);
    });
  }

  function linkClass(product){
    if(/^UX-/i.test(product)) return '';
    if(/^BX-/i.test(product)) return ' bx';
    if(/^CX-/i.test(product)) return ' cx';
    return ' other';
  }
  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  function render(){
    renderFilters();
    const list=$('#list');
    const visited=readVisited();
    const filtered=state.city==='全部' ? state.entries : state.entries.filter(x=>x.city===state.city);
    if(!filtered.length){ list.innerHTML='<div class="empty">目前這個篩選沒有符合條件的抽選。</div>'; return; }

    const byCity=new Map();
    filtered.forEach(x=>{
      if(!byCity.has(x.city)) byCity.set(x.city,new Map());
      const sm=byCity.get(x.city);
      const sk=x.store+'|||'+x.startText;
      if(!sm.has(sk)) sm.set(sk,[]);
      sm.get(sk).push(x);
    });

    list.innerHTML='';
    const cityEntries=[...byCity.entries()].sort((a,b)=>cityRank(a[0])-cityRank(b[0]) || a[0].localeCompare(b[0],'zh-Hant'));
    for(const [city,stores] of cityEntries){
      const cityEl=document.createElement('section');
      cityEl.innerHTML=`<div class="city">${escapeHtml(city)}</div>`;
      for(const [sk,items] of stores){
        const [store,startText]=sk.split('|||');
        const t=timing(startText);
        const card=document.createElement('div');
        card.className='store';
        card.innerHTML=`<div class="store-head"><div class="store-name">${escapeHtml(store)}</div><span class="badge ${t.cls}">${escapeHtml(t.label)}</span></div><div class="draw-start">${escapeHtml(startText)}</div>`;
        items.forEach(x=>{
          const done=visited.has(x.key);
          const row=document.createElement('div');
          row.className='item';
          row.innerHTML=`<div class="product">${escapeHtml(x.product)}</div><a class="draw-link${linkClass(x.product)}${done?' visited':''}${t.disabled?' disabled':''}" href="${escapeHtml(x.href)}" target="_blank" rel="noopener" data-key="${x.key}">${done?'已抽過':'抽獎'}</a>`;
          const a=$('a',row);
          if(!t.disabled){
            a.addEventListener('click',()=>{
              const set=readVisited(); set.add(x.key); writeVisited(set);
              a.classList.add('visited'); a.textContent='已抽過';
            });
          }
          card.appendChild(row);
        });
        cityEl.appendChild(card);
      }
      list.appendChild(cityEl);
    }
  }

  async function load(manual=false){
    const status=$('#status');
    const btn=$('#syncBtn');
    btn.disabled=true;
    status.textContent=manual ? '正在重新抓取 FUNBOX 最新資料…' : '正在讀取 FUNBOX 最新資料…';
    try{
      const html=await fetchSource();
      const entries=extract(html);
      if(!entries.length) throw new Error(`${state.waveLabel} 找不到符合篩選條件的商品`);
      state.entries=entries;
      state.loadedAt=new Date();
      if(state.city!=='全部' && !entries.some(x=>x.city===state.city)) state.city='全部';
      render();
      const stores=new Set(entries.map(x=>x.city+'|||'+x.store)).size;
      status.textContent=`${state.waveLabel}｜${stores} 間門市・${entries.length} 個符合商品｜更新 ${state.loadedAt.toLocaleTimeString('zh-TW',{hour:'2-digit',minute:'2-digit'})}`;
    }catch(e){
      console.error(e);
      $('#list').innerHTML=`<div class="error">讀取失敗：${escapeHtml(e.message || String(e))}</div>`;
      status.textContent='讀取失敗，可按「立即更新資料」重試。';
    }finally{
      btn.disabled=false;
    }
  }

  $('#syncBtn').addEventListener('click',()=>load(true));
  $('#resetBtn').addEventListener('click',()=>{
    if(!confirm(`確定清除 ${state.waveLabel} 這台裝置的已抽標記？`)) return;
    localStorage.removeItem(state.storageKey);
    render();
  });

  load(false);
  setInterval(()=>load(false),60*60*1000);
  document.addEventListener('visibilitychange',()=>{
    if(document.visibilityState==='visible' && (!state.loadedAt || Date.now()-state.loadedAt.getTime()>10*60*1000)) load(false);
  });
})();
</script>
</body>
</html>
