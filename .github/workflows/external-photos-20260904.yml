name: Switch family photos to external image host

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/external-photos-20260904.yml"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Replace photo sources
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old1 = '<img src="assets/aping-win.webp" alt="抽中戰鬥陀螺的開心照片">'
          old2 = '<img src="assets/aping-funbox.webp" alt="FUNBOX 原價陀螺戰果照片">'
          new1 = '<img src="https://i.urusai.cc/DK9iw.png" alt="抽中戰鬥陀螺的開心照片" referrerpolicy="no-referrer">'
          new2 = '<img src="https://i.urusai.cc/125Tb.png" alt="FUNBOX 原價陀螺戰果照片" referrerpolicy="no-referrer">'
          if old1 not in s or old2 not in s:
              raise SystemExit('Expected photo tags not found; aborting without changing page')
          s = s.replace(old1, new1).replace(old2, new2)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit page change and remove one-shot workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/external-photos-20260904.yml
          git add index.html
          git commit -m "Use external image host for family photos"
          git push
