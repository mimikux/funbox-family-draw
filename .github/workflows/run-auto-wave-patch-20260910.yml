name: Run auto wave patch

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/run-auto-wave-patch-20260910.yml"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch index
        run: python3 scripts/patch_auto_wave.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/run-auto-wave-patch-20260910.yml
          git add index.html
          git commit -m "Auto-follow latest FUNBOX draw wave"
          git push
