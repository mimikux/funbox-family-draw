name: Inline photos into family draw page
on:
  push:
    paths:
      - '.github/workflows/inline-photos-20260904.yml'
permissions:
  contents: write
jobs:
  inline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inline both photos and enforce latest copy/filter
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          photos = {
              'assets/aping-win.webp': Path('assets/aping-win.webp'),
              'assets/aping-funbox.webp': Path('assets/aping-funbox.webp'),
          }
          for old, fp in photos.items():
              if not fp.exists():
                  raise SystemExit(f'missing asset: {fp}')
              data = base64.b64encode(fp.read_bytes()).decode('ascii')
              s = s.replace(f'src="{old}"', f'src="data:image/webp;base64,{data}"')

          s = s.replace('感謝大家幫忙，阿平感恩🤣', '感謝大家幫忙，阿平愛你喔😍')
          old_fn = 'function isExcluded(product){ return EXCLUDE_CODE.test(product) || EXCLUDE_WORDS.test(product); }'
          new_fn = "function isExcluded(product){ return EXCLUDE_CODE.test(product) || EXCLUDE_WORDS.test(product) || /BX-00\\s*暴風天馬3-70RA/i.test(product); }"
          if old_fn in s:
              s = s.replace(old_fn, new_fn)

          if 'src="assets/aping-win.webp"' in s or 'src="assets/aping-funbox.webp"' in s:
              raise SystemExit('photo refs were not fully inlined')
          if 'data:image/webp;base64,' not in s:
              raise SystemExit('no inline photo data found')
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit fixed page
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm .github/workflows/inline-photos-20260904.yml
          git add index.html .github/workflows/inline-photos-20260904.yml
          git commit -m 'Inline family photos to fix GitHub Pages image loading'
          git push
