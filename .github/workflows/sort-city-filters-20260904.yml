name: Sort city filter buttons geographically

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/sort-city-filters-20260904.yml"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Update city filter order
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = "    const cities=[...counts.keys()].sort((a,b)=>a.localeCompare(b,'zh-Hant'));"
          new = """    const cityOrder = ['基隆','台北','新北','桃園','新竹市','新竹縣','苗栗','台中','彰化','南投','雲林','嘉義市','嘉義縣','台南','高雄','屏東','澎湖','金門','連江','宜蘭','花蓮','台東'];\n    const cityRank = city => {\n      const c = city.replace(/臺/g,'台');\n      const i = cityOrder.findIndex(name => c.includes(name) || name.includes(c));\n      return i < 0 ? cityOrder.length : i;\n    };\n    const cities=[...counts.keys()].sort((a,b)=>cityRank(a)-cityRank(b) || a.localeCompare(b,'zh-Hant'));"""
          if old not in s:
              raise SystemExit('Expected city sort line not found; aborting')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Commit page change and remove one-shot workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/sort-city-filters-20260904.yml
          git add index.html
          git commit -m "Sort city filters north to south with east last"
          git push
