name: One-time filter and copy update
on:
  push:
    paths:
      - '.github/workflows/one-time-filter-copy-20260904.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update index
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old_li = '<li>感謝大家幫忙，阿平感恩🤣</li>'
          new_li = '<li>感謝大家幫忙，阿平愛你喔😍</li>'
          if old_li in s:
              s = s.replace(old_li, new_li, 1)
          old_fn = 'function isExcluded(product){ return EXCLUDE_CODE.test(product) || EXCLUDE_WORDS.test(product); }'
          new_fn = "function isExcluded(product){ return EXCLUDE_CODE.test(product) || EXCLUDE_WORDS.test(product) || /BX-00\\s*暴風天馬3-70RA/i.test(product); }"
          if old_fn in s:
              s = s.replace(old_fn, new_fn, 1)
          elif '暴風天馬3-70RA' not in s:
              raise SystemExit('isExcluded pattern not found')
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit update and remove one-time workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm .github/workflows/one-time-filter-copy-20260904.yml
          git add index.html .github/workflows/one-time-filter-copy-20260904.yml
          git commit -m 'Exclude BX-00 Pegasus and update thank-you copy'
          git push
