<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FUNBOX 親友幫抽抽｜後台設定</title>
<style>
:root{--blue:#1f497d;--green:#21a366;--red:#d9534f;--bg:#f5f6f8;--text:#222;--muted:#666}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",Roboto,"Helvetica Neue",Arial,sans-serif}
.wrap{max-width:860px;margin:auto;padding:22px 16px 50px}
h1{color:var(--blue);font-size:32px;margin:0 0 8px}
.sub{color:var(--muted);margin-bottom:18px}
.card{background:#fff;border-radius:16px;padding:18px;box-shadow:0 2px 10px rgba(0,0,0,.06);margin-bottom:16px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
input[type=password]{flex:1;min-width:180px;padding:12px 14px;border:1px solid #ccd2d8;border-radius:10px;font-size:18px}
button,.back{border:0;border-radius:10px;padding:11px 16px;font-size:17px;font-weight:800;cursor:pointer;text-decoration:none;display:inline-block}
.primary{background:var(--blue);color:#fff}.save{background:var(--green);color:#fff}.danger{background:var(--red);color:#fff}.back{background:#e5e7ea;color:#222}
.status{margin-top:10px;color:#666}
.products{display:grid;gap:9px;margin-top:12px}
.product{display:flex;align-items:flex-start;gap:10px;padding:12px;border:1px solid #e4e7eb;border-radius:12px}
.product input{width:22px;height:22px;margin-top:2px}
.product label{flex:1;font-size:18px;line-height:1.4}
.fixed{opacity:.6;background:#f2f2f2}
.badge{display:inline-block;font-size:13px;font-weight:800;border-radius:999px;padding:3px 8px;margin-left:6px;background:#eee;color:#666}
.badge.fixed-badge{background:#fde8e8;color:#a32828}
.hide{display:none!important}
.note{font-size:14px;color:#777;line-height:1.6}
@media(max-width:560px){h1{font-size:28px}.product label{font-size:17px}.row>*{width:100%}}
</style>
</head>
<body>
<div class="wrap">
  <h1>FUNBOX 親友幫抽抽｜後台</h1>
  <div class="sub">設定本週要排除、不顯示在前台的商品。</div>

  <section class="card" id="loginCard">
    <div class="row">
      <input id="password" type="password" inputmode="numeric" placeholder="輸入後台密碼" autocomplete="current-password">
      <button class="primary" id="loginBtn" type="button">登入</button>
    </div>
    <div class="status" id="loginStatus"></div>
  </section>

  <section class="card hide" id="adminCard">
    <div class="row">
      <a class="back" href="./">← 回前台</a>
      <button class="primary" id="refreshBtn" type="button">↻ 重新抓最新產品</button>
      <button class="save" id="saveBtn" type="button">儲存排除設定</button>
      <button class="danger" id="clearBtn" type="button">清除自訂排除</button>
    </div>
    <div class="status" id="status">正在讀取最新抽選資料…</div>
    <div class="products" id="products"></div>
    <p class="note">「固定排除」是前台原本的規則（BXG、配件、BX-26、BX-33、BX-00 暴風天馬），不可在這裡取消。其他商品可以自由勾選排除。</p>
  </section>
</div>
<script>
(() => {
  'use strict';
  const SOURCE_URLS=[
    'https://raw.githubusercontent.com/UXUX11/funbox-line/main/index.html',
    'https://uxux11.github.io/funbox-line/'
  ];
  const PASSWORD_HASH='6e65b61d030e5ac6492802c6f619a63006e5b0e2cafc0170ab92a68083162528';
  const ACCESSORY_WORDS=/(戰鬥盤|對戰盤|競技場|收納包|收納箱|收納盒|收納袋|發射器|握把|拉條)/i;
  const EXCLUDE_CODE=/\b(?:BXG-\d+|BX-26|BX-33)\b/i;
  const EXCLUDE_BX00=/\bBX-00\s*暴風天馬/i;

  let waveStart='', waveEnd='', waveLabel='本週';
  let products=[];

  const $=s=>document.querySelector(s);
  const $$=(s,r=document)=>Array.from(r.querySelectorAll(s));
  function clean(s){return String(s||'').replace(/\s+/g,' ').trim()}
  function productKey(p){return clean(p).replace(/\s*[（(]\s*\$[^）)]*[）)]\s*$/,'').trim()}
  function fixedExcluded(p){const x=clean(p);return EXCLUDE_CODE.test(x)||EXCLUDE_BX00.test(x)||ACCESSORY_WORDS.test(x)}
  function dates(text){return [...String(text||'').matchAll(/(\d{4}\/\d{2}\/\d{2})/g)].map(m=>m[1])}
  function d0(key){const m=String(key||'').match(/(\d{4})\/(\d{2})\/(\d{2})/);return m?new Date(+m[1],+m[2]-1,+m[3]):null}
  function storageKey(){return 'aping_admin_excluded_'+(waveStart||'pending').replaceAll('/','')+'_'+(waveEnd||'pending').replaceAll('/','')}
  function readSaved(){try{return new Set(JSON.parse(localStorage.getItem(storageKey())||'[]'))}catch{return new Set()}}
  function shortDate(key){const p=key.split('/');return p.length===3?`${+p[1]}/${+p[2]}`:key}

  async function sha256(text){
    const buf=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(text));
    return [...new Uint8Array(buf)].map(b=>b.toString(16).padStart(2,'0')).join('');
  }

  async function fetchSource(){
    let err;
    for(const base of SOURCE_URLS){
      try{
        const res=await fetch(base+(base.includes('?')?'&':'?')+'t='+Date.now(),{cache:'no-store'});
        if(!res.ok) throw new Error('HTTP '+res.status);
        return await res.text();
      }catch(e){err=e}
    }
    throw err||new Error('無法讀取來源');
  }

  function chooseWave(doc){
    const groups=new Map();
    $$('.draw-store',doc).forEach(el=>{
      const ds=dates(el.querySelector('.draw-start')?.textContent||'');
      if(!ds.length)return;
      const a=ds[0],b=ds[ds.length-1]||a,ad=d0(a),bd=d0(b)||ad;
      if(!ad||!bd)return;
      if(!groups.has(a))groups.set(a,{a,ad,b,bd});
      const g=groups.get(a);if(bd>g.bd){g.b=b;g.bd=bd}
    });
    const list=[...groups.values()].sort((x,y)=>x.ad-y.ad);
    if(!list.length)return null;
    const today=new Date();today.setHours(0,0,0,0);
    return list.find(g=>g.bd>=today)||list[list.length-1];
  }

  function parse(html){
    const doc=new DOMParser().parseFromString(html,'text/html');
    const wave=chooseWave(doc);if(!wave)throw new Error('找不到最新抽選波次');
    waveStart=wave.a;waveEnd=wave.b||wave.a;
    waveLabel=waveStart===waveEnd?shortDate(waveStart):shortDate(waveStart)+'–'+shortDate(waveEnd);
    const set=new Map();
    $$('.draw-store',doc).forEach(store=>{
      const start=store.querySelector('.draw-start')?.textContent||'';
      const ds=dates(start);
      if(!ds.length||ds[0]!==waveStart)return;
      $$('.draw-product',store).forEach(el=>{
        const full=clean(el.textContent||'');
        if(!full)return;
        const key=productKey(full);
        if(!set.has(key))set.set(key,{key,full,fixed:fixedExcluded(full)});
      });
    });
    return [...set.values()].sort((a,b)=>a.key.localeCompare(b.key,'zh-Hant'));
  }

  function render(){
    const saved=readSaved();
    $('#status').textContent=`${waveLabel}｜共 ${products.length} 種商品；已自訂排除 ${saved.size} 種`;
    $('#products').innerHTML='';
    products.forEach((p,i)=>{
      const div=document.createElement('div');
      div.className='product'+(p.fixed?' fixed':'');
      const id='p'+i;
      div.innerHTML=`<input id="${id}" type="checkbox" ${p.fixed?'checked disabled':(saved.has(p.key)?'checked':'')} data-key="${p.key}">
        <label for="${id}">${p.key}${p.fixed?'<span class="badge fixed-badge">固定排除</span>':'<span class="badge">可自訂</span>'}</label>`;
      $('#products').appendChild(div);
    });
  }

  async function load(){
    $('#status').textContent='正在抓取最新 FUNBOX 商品…';
    const html=await fetchSource();
    products=parse(html);
    render();
  }

  $('#loginBtn').addEventListener('click',async()=>{
    const pass=$('#password').value;
    const h=await sha256(pass);
    if(h!==PASSWORD_HASH){$('#loginStatus').textContent='密碼錯誤';return}
    $('#loginCard').classList.add('hide');
    $('#adminCard').classList.remove('hide');
    try{await load()}catch(e){$('#status').textContent='讀取失敗：'+(e.message||e)}
  });
  $('#password').addEventListener('keydown',e=>{if(e.key==='Enter')$('#loginBtn').click()});
  $('#refreshBtn').addEventListener('click',()=>load().catch(e=>$('#status').textContent='讀取失敗：'+(e.message||e)));
  $('#saveBtn').addEventListener('click',()=>{
    const selected=[];
    $$('#products input[type=checkbox]:not(:disabled):checked').forEach(x=>selected.push(x.dataset.key));
    localStorage.setItem(storageKey(),JSON.stringify(selected));
    $('#status').textContent=`已儲存：${waveLabel} 自訂排除 ${selected.length} 種商品。回前台重新整理後生效。`;
  });
  $('#clearBtn').addEventListener('click',()=>{
    if(!confirm('確定清除這一波所有自訂排除？'))return;
    localStorage.removeItem(storageKey());
    render();
  });
})();
</script>
</body>
</html>
